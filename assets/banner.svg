<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes flowScan {
      0% { transform: translateY(-40px); opacity: 0; }
      30% { opacity: 0.8; }
      70% { opacity: 0.8; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseShield {
      0%, 100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 10px #818cf8); }
    }
    @keyframes tokenSlide {
      0% { transform: translateX(0); }
      50% { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 240px; }
    .scanline { animation: flowScan 4s linear infinite; }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .shield-icon { animation: pulseShield 3s ease-in-out infinite; }
    .pill-anim { animation: tokenSlide 4s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    .mono-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)"/>
  <rect width="1196" height="336" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dynamic Glowing Orbs (in deep background) -->
  <circle class="orb1" cx="180" cy="90" r="140" fill="#0284c7" filter="url(#glow)"/>
  <circle class="orb2" cx="1020" cy="230" r="160" fill="#6366f1" filter="url(#glow)"/>

  <!-- Subtle Cyber Security Grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- Dynamic Background Scanning Beam -->
  <g class="scanline" opacity="0.6">
    <rect x="0" y="0" width="1200" height="2" fill="url(#beam)"/>
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="320" cy="70" r="2.5" fill="#38bdf8"/>
  <circle class="p2" cx="880" cy="85" r="3" fill="#818cf8"/>
  <circle class="p3" cx="1110" cy="140" r="2" fill="#c084fc"/>
  <circle class="p1" cx="120" cy="240" r="2" fill="#38bdf8"/>
  <circle class="p2" cx="640" cy="300" r="2.5" fill="#38bdf8"/>

  <!-- Foreground Content: Shield Icon -->
  <g transform="translate(60, 52)">
    <!-- Outer Shield Frame -->
    <path class="shield-icon" d="M48 4 L14 18 C14 58 48 84 48 84 C48 84 82 58 82 18 Z" 
          fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Lock / Privacy Symbol inside Shield -->
    <rect x="38" y="44" width="20" height="16" rx="3" fill="#38bdf8"/>
    <path d="M42 44 V36 C42 32.5 44 30 48 30 C52 30 54 32.5 54 36 V44" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="51" r="2" fill="#0f172a"/>
  </g>

  <!-- Foreground Main Title & Badges (Positioned safely above decorative elements) -->
  <g transform="translate(170, 72)">
    <!-- Badge / Eyebrow -->
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8" filter="url(#badge-glow)"/>
    <text x="26" y="16" fill="#38bdf8" class="mono-text" font-size="11" font-weight="700" letter-spacing="1.5">DATA PRIVACY &amp; PII SHIELD</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="url(#title-grad)" class="title-text" font-size="35" letter-spacing="-0.5">
      Awesome-Data-Privacy-PII-Redaction
    </text>

    <!-- Subtitle -->
    <text x="0" y="88" fill="#94a3b8" class="subtitle-text" font-size="16">
      Curated Ecosystem for LLM Prompt Sanitization, Reversible Masking &amp; Enterprise Governance
    </text>
  </g>

  <!-- Dynamic Foreground Feature Pills (Safe lower section, never obscures text) -->
  <g class="pill-anim" transform="translate(60, 208)">
    <!-- Pill 1: Presidio & Zero-Shot -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="6" fill="#10b981"/>
      <text x="36" y="26" fill="#f1f5f9" class="subtitle-text" font-size="13" font-weight="600">Local-First PII Masking</text>
      <text x="180" y="26" fill="#64748b" class="mono-text" font-size="11">Fast &amp; Zero-Dep</text>
    </g>

    <!-- Pill 2: LLM Gateway / Proxy -->
    <g transform="translate(266, 0)">
      <rect width="250" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="6" fill="#38bdf8"/>
      <text x="36" y="26" fill="#f1f5f9" class="subtitle-text" font-size="13" font-weight="600">Reversible Tokenization</text>
      <text x="195" y="26" fill="#64748b" class="mono-text" font-size="11">De-Ident</text>
    </g>

    <!-- Pill 3: Enterprise DSPM -->
    <g transform="translate(532, 0)">
      <rect width="260" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="6" fill="#a855f7"/>
      <text x="36" y="26" fill="#f1f5f9" class="subtitle-text" font-size="13" font-weight="600">Autonomous Agent Guards</text>
      <text x="208" y="26" fill="#64748b" class="mono-text" font-size="11">Fail-Closed</text>
    </g>

    <!-- Pill 4: Audit & Compliance -->
    <g transform="translate(808, 0)">
      <rect width="272" height="42" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="6" fill="#f59e0b"/>
      <text x="36" y="26" fill="#f1f5f9" class="subtitle-text" font-size="13" font-weight="600">GDPR • HIPAA • EU AI Act</text>
      <text x="210" y="26" fill="#64748b" class="mono-text" font-size="11">Audit Trails</text>
    </g>
  </g>

  <!-- Interactive/Live Redaction Demo Flow Bar (Bottom) -->
  <g transform="translate(60, 272)">
    <rect width="1080" height="34" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <text x="18" y="22" fill="#64748b" class="mono-text" font-size="12">Raw Prompt:</text>
    <text x="115" y="22" fill="#ef4444" class="mono-text" font-size="12">"Email ishan@example.com, Card 4532-****"</text>
    
    <!-- Transition Arrow -->
    <path d="M470 17 L495 17 M490 12 L496 17 L490 22" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <text x="520" y="22" fill="#10b981" class="mono-text" font-size="12">Safe Redacted:</text>
    <text x="635" y="22" fill="#38bdf8" class="mono-text" font-size="12">"Email &lt;EMAIL_1&gt;, Card &lt;CREDIT_CARD_1&gt;"</text>
    
    <rect x="970" y="7" width="95" height="20" rx="4" fill="#1e293b"/>
    <text x="982" y="21" fill="#34d399" class="mono-text" font-size="10" font-weight="700">SECURE BOUNDARY</text>
  </g>
</svg>
